name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

# fusion#2 CI efficiency: one run per ref, superseded runs cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # fusion#2: per-stack dependency cache (pip), keyed on pyproject.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fusion-core (in-tree shared dependency)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/dahai80/fusion-core.git@master"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -e ".[all]"

      - name: Lint (ruff)
        run: ruff check fusion_multi_node/

      - name: No-docstring convention gate (refs dahai80/fusion#9)
        run: python ci/check_docstrings.py

      - name: Test (pytest, random order)
        env:
          FUSION_PERMISSION_ENFORCE: "0"
        run: pytest tests/ -q -p randomly --no-header

      - name: Test (pytest, reverse order — isolation regression)
        env:
          FUSION_PERMISSION_ENFORCE: "0"
        run: pytest tests/ -q -p randomly --randomly-seed=1 --no-header
