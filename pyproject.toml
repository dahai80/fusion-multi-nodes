[project]
name = "fusion-multi-node"
version = "0.1.0"
description = "Multi-node cluster for Apple Silicon — node discovery, FMP routing, load balancing, distributed MLX inference"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]
mdns = [
    "zeroconf>=0.130.0",
]
all = [
    "fusion-multi-node[test,web,mdns]",
    "netifaces>=0.11.0",
]

[project.scripts]
fusion-multi-node = "fusion_multi_node.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_multi_node*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
