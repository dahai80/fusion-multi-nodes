[project]
name = "fusion-multi-node"
version = "0.12.1"
description = "Multi-node cluster for Apple Silicon — node discovery, FMP routing, load balancing, distributed MLX inference"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "zeroconf>=0.130.0",
    "cryptography>=44.0.0",
    "protobuf>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]
all = [
    "fusion-multi-node[test,web]",
    "netifaces>=0.11.0",
    "grpcio-tools>=1.60.0",
]

[project.scripts]
fusion-multi-node = "fusion_multi_node.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "C4"]
ignore = [
    "BLE001",
    "E741",
    "S110",
    "SIM102",
    "SIM105",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"**/fmp_proto_pb2.py" = ["E501"]
"**/fmp_protobuf.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_multi_node"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_multi_node*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
